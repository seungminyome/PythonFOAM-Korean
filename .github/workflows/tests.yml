name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r Solver_Examples/PODFoam/llm_demo/requirements.txt
      - name: llm_demo unit tests (no OpenFOAM, no model)
        working-directory: Solver_Examples/PODFoam/llm_demo
        run: python -m unittest test_llm_client test_callback test_ablation_runner -v
